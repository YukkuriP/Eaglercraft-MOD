name: Node test suite

on:
  push:
    branches: [main, phase-31-cross-block-dataflow, phase-32-interprocedural-helper-summaries, phase-33-nested-helper-summaries, phase-34-direct-client-import, phase-35-integrated-game-import, phase-36-safe-converter-stability]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        run: >-
          node --test
          tests/index-smoke.test.js
          tests/generic-mod-analyzer.test.js
          tests/resource-converter.test.js
          tests/entity-model-converter.test.js
          tests/machine-state-control-flow.test.js
          tests/machine-state-condition-operands.test.js
          tests/machine-state-cross-block-dataflow.test.js
          tests/machine-state-interprocedural-summaries.test.js
          tests/machine-state-nested-helper-summaries.test.js
