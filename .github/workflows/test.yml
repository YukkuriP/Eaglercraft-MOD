name: Jar2Zeus tests

on:
  push:
    branches:
      - main
      - feature/epw-epk-deep-inspector
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test tests/*.test.js
